[build]
  command = "npm run build"
  publish = "dist"

# Ensure JavaScript and WebAssembly modules are served with correct MIME types.
# This is critical for Vite-built bundles and the PDF.js worker (.mjs file).
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/assets/*.mjs"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
